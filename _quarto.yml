# --------------------------------------------------
# Bibliography and numbering
# --------------------------------------------------

bibliography: bib/lmfit5.bib
csl: atbd/format.csl
link-citations: true


number-sections: true
number-depth: 3

crossref:
  chapters: true


# --------------------------------------------------
# Output formats
# --------------------------------------------------

format:

  html:
    theme: cosmo
    css: atbd/styles.css
    toc: true
    toc-depth: 3
    toc-location: right

    # Do not display author/affiliation metadata on chapter pages
    title-block-style: none
    
    code-fold: false
    smooth-scroll: true
    link-external-newwindow: true

    page-layout: article

    grid:
      sidebar-width: 300px
      body-width: 900px
      margin-width: 260px
      gutter-width: 1.5rem

  pdf:
    keep-tex: true

    # Technical-report style
    documentclass: scrreprt
    papersize: letter
    fontsize: 11pt

    toc: true
    toc-depth: 3
    lof: true
    lot: true

    colorlinks: true
    linkcolor: blue
    citecolor: blue
    urlcolor: blue

    geometry:
      - top=1in
      - bottom=1in
      - left=1in
      - right=1in

    include-in-header: atbd/header.tex

    # Custom PDF title page
    template-partials:
      - atbd/title.tex
